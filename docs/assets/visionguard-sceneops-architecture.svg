<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="VisionGuard AI is the safety review product, powered by the SceneOps evaluation architecture. Warehouse is the current supported MVP; parking, retail and construction are planned extensions.">
